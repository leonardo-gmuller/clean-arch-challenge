version: '3'

services:
  app:
    container_name: app
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DB_DRIVER: "${DB_DRIVER}"
        DB_HOST: "${DB_HOST}"
        DB_PORT: "${DB_PORT}"
        DB_USER: "${DB_USER}"
        DB_PASSWORD: "${DB_PASSWORD}"
        DB_NAME: "${DB_NAME}"
        WEB_SERVER_PORT: "${WEB_SERVER_PORT}"
        GRPC_SERVER_PORT: "${GRPC_SERVER_PORT}"
        GRAPHQL_SERVER_PORT: "${GRAPHQL_SERVER_PORT}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    ports:
      - "${WEB_SERVER_PORT}:8000"
      - "${GRPC_SERVER_PORT}:50051"
      - "${GRAPHQL_SERVER_PORT}:8080"
    restart: on-failure
    env_file:
      - .env
      

  db:
    image: mysql:5.7
    platform: linux/amd64
    container_name: mysql_orders
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
      MYSQL_PASSWORD: root
    healthcheck:
      test: ["CMD", "sh", "-c", "mysql -h db -u root -proot -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - 3306:3306
    volumes:
      - .docker/mysql:/var/lib/mysql
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3.8.16-management
    container_name: rabbitmq_orders
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - app_network
networks:
  app_network:
    driver: bridge
      